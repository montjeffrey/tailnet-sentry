name: release

# A v* tag tests the tagged commit, builds a static binary for every
# platform, publishes them with SHA-256 checksums, and attaches a build
# provenance attestation proving each binary came from this repository and
# this workflow. Verify a download with:
#   gh attestation verify sentry-linux-amd64 --repo montjeffrey/tailnet-sentry

on:
  push:
    tags: ['v*']

permissions:
  contents: write      # create the release
  id-token: write      # sign the provenance attestation
  attestations: write  # store it

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so the tag can be checked against main

      # Release only what is already on main. A v* tag on any other commit
      # (an unmerged branch, say) stops here, before anything is built,
      # signed or published.
      - name: tagged commit is on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${GITHUB_REF_NAME} ($(git rev-parse HEAD)) is not on main; refusing to release it"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned so a release is built by a known compiler; keep it equal
          # to the toolchain line in go.mod.
          go-version: '1.27.2'
          cache: true

      # Never ship what has not passed: the tagged commit is tested again here.
      - name: test the tagged commit
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: build every platform
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          # CGO off so each binary is fully static and needs no runtime.
          build() {
            local os=$1 arch=$2 ext=${3:-}
            local name="sentry-${os}-${arch}${ext}"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build \
              -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${name}" ./cmd/sentry
            echo "built ${name}"
          }
          build linux   amd64
          build linux   arm64
          build darwin  amd64
          build darwin  arm64
          build windows amd64 .exe
          build windows arm64 .exe

      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/sentry-*"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
